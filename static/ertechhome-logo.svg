<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Server Rack / Home Gateway Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer hexagon server housing -->
    <polygon points="40,2 78,22 78,62 40,82 2,62 2,22" fill="#0B1120" stroke="url(#cyberCyan)" stroke-width="2.5" />
    <!-- Rack Blades -->
    <rect x="14" y="22" width="52" height="8" rx="2" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="26" r="2" fill="#10B981" />
    <circle cx="28" cy="26" r="2" fill="#06B6D4" />
    <line x1="36" y1="26" x2="60" y2="26" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <rect x="14" y="36" width="52" height="8" rx="2" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="40" r="2" fill="#3B82F6" />
    <circle cx="28" cy="40" r="2" fill="#10B981" />
    <line x1="36" y1="40" x2="60" y2="40" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <rect x="14" y="50" width="52" height="8" rx="2" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="54" r="2" fill="#8B5CF6" />
    <circle cx="28" cy="54" r="2" fill="#10B981" />
    <line x1="36" y1="54" x2="60" y2="54" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  </g>
  <!-- Text Brand -->
  <g transform="translate(105, 20)">
    <text x="0" y="40" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="40" fill="#F8FAFC" letter-spacing="1">ERTECH<tspan fill="url(#cyberCyan)">.HOME</tspan></text>
    <rect x="0" y="50" width="240" height="3" fill="url(#cyberCyan)" rx="1.5" />
    <text x="0" y="66" font-family="'ui-monospace', 'Menlo', monospace" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="3.5">ENTERPRISE HOMELAB &amp; CLOUD ARCHITECTURE</text>
  </g>
  <!-- Status Chip -->
  <g transform="translate(425, 28)">
    <rect width="80" height="34" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="16" cy="17" r="4" fill="#10B981" />
    <text x="26" y="21" font-family="'ui-monospace', monospace" font-size="10" font-weight="800" fill="#E2E8F0">ONLINE</text>
  </g>
</svg>
